<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIGO</title>
<style>
:root {
  --bg: #ffffff; --panel: #f4f4f4; --panel2: #ebebeb; --line: #e3e3e3; --text: #1f1f1f; --dim: #6f6f6f;
  --faint: #a3a3a3; --me: #f0f0f0; --ok: #1f8a54; --ok-bg: #e3f4ea; --no: #c4413a; --acc: #3b6fd8;
  --btn: #1f1f1f; --btn-text: #ffffff; --shadow: 0 8px 30px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0f; --panel: #1b1b1b; --panel2: #242424; --line: #2c2c2c; --text: #ececec; --dim: #9a9a9a;
    --faint: #5f5f5f; --me: #2f2f2f; --ok: #4cc38a; --ok-bg: #173526; --no: #e5675f; --acc: #7aa2f7;
    --btn: #ececec; --btn-text: #111111; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
[hidden] { display: none !important; }

/* top bar: small and quiet */
header { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--bg); z-index: 20; }
header .logo { font-weight: 650; letter-spacing: .06em; margin-right: 6px; cursor: pointer; }
header .grow { flex: 1; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--dim); }
select.pill { appearance: none; padding-right: 22px; background: linear-gradient(45deg, transparent 50%, var(--dim) 50%) right 11px center / 5px 5px no-repeat, linear-gradient(-45deg, transparent 50%, var(--dim) 50%) right 7px center / 5px 5px no-repeat; }
.stat { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 3px 11px; font-size: 13px; color: var(--dim); }
.seg button.on { background: var(--panel2); color: var(--text); }
.ghost { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 12px; font-size: 13px; }

/* start screen */
#start { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 80px 16px 18vh; }
#start h1 { font-weight: 400; font-size: 28px; margin: 0; }
.box { width: min(720px, 100%); background: var(--panel); border-radius: 28px; padding: 10px 10px 10px 20px; display: flex; align-items: flex-end; gap: 8px; box-shadow: var(--shadow); }
.box textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; padding: 7px 0; max-height: 200px; line-height: 1.5; }
.send { width: 36px; height: 36px; flex: none; border-radius: 50%; border: 0; background: var(--btn); color: var(--btn-text); display: grid; place-items: center; font-size: 17px; }
.send:disabled { opacity: .3; cursor: default; }
.send.stop::before { content: ""; width: 11px; height: 11px; background: var(--btn-text); border-radius: 2px; }
.link { background: none; border: 0; color: var(--dim); font-size: 13.5px; text-decoration: underline dotted; text-underline-offset: 3px; padding: 0; }
.err { color: var(--no); font-size: 13.5px; }

/* chat */
#chat { max-width: 860px; margin: 0 auto; padding: 70px 16px 150px; }
body.side-open #chat { margin-right: 456px; margin-left: max(16px, calc(100vw - 1316px)); }
.me { margin: 26px 0 18px auto; width: fit-content; max-width: 80%; background: var(--me); padding: 9px 16px; border-radius: 20px; white-space: pre-wrap; animation: rise .3s ease; }
.me .back, .bot > .back { display: block; font-size: 12px; color: var(--dim); background: none; border: 0; padding: 0; margin-top: 2px; text-decoration: underline dotted; }
.bot { margin: 16px 0; animation: rise .35s ease; }
.bot p { margin: 4px 0; }
.step { color: var(--dim); font-size: 12.5px; letter-spacing: .02em; margin-bottom: 6px; }
.note { color: var(--dim); font-size: 13.5px; }
.bad { color: var(--no); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.btn { border: 0; background: var(--btn); color: var(--btn-text); border-radius: 999px; padding: 6px 16px; font-size: 13.5px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.line { background: none; color: var(--text); border: 1px solid var(--line); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* the live line: what the system is doing now */
#live { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 13.5px; margin: 14px 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: none; } }
.log { margin: 6px 0; padding: 8px 12px; border-left: 2px solid var(--line); color: var(--dim); max-height: 220px; overflow: auto; }
.log div { white-space: pre-wrap; word-break: break-word; }
.verbose-only { display: none; }
body.verbose .verbose-only { display: block; }
body.verbose span.verbose-only { display: inline; }

/* step 1: parts */
.parts { display: flex; flex-wrap: wrap; gap: 8px; }
.part { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 10px; }
.part input { border: 0; background: none; outline: 0; padding: 2px 0; min-width: 40px; }
.part input.attr { font-weight: 550; }
.part input.val { color: var(--dim); font-size: 13.5px; }
.part .eq { color: var(--faint); font-size: 13px; }
.part .x { border: 0; background: none; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 4px; }
.part.add { border-style: dashed; color: var(--dim); padding: 4px 12px; background: none; }
.locked .part { background: none; }
.locked .part .x, .locked .part.add { display: none; }

/* step 2 and 3: places per part, side by side */
.cols { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.col { flex: 1 1 0; min-width: 240px; background: var(--panel); border-radius: 14px; padding: 10px 8px 8px; opacity: 0; transform: translateX(-24px); transition: opacity .5s ease, transform .5s ease; }
.col.in { opacity: 1; transform: none; }
.col h4 { margin: 0 6px 8px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.col h4 small { color: var(--dim); font-weight: 400; font-size: 12px; }
.cand { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 9px; opacity: 0; transform: translateY(4px); transition: opacity .45s ease, transform .45s ease, background .2s; }
.cand.in { opacity: 1; transform: none; }
.cand:hover { background: var(--panel2); }
.cand .mark { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: none; padding: 0; font-size: 11px; line-height: 18px; color: transparent; }
.cand .name { border: 0; background: none; padding: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand .name small { color: var(--dim); }
.cand .meta { display: flex; align-items: center; gap: 6px; }
.bar { width: 42px; height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.score { font-size: 11.5px; color: var(--dim); width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.val { font-size: 11px; padding: 0 6px; border-radius: 6px; white-space: nowrap; }
.val.y { background: var(--ok-bg); color: var(--ok); }
.val.n { color: var(--faint); }
.why { grid-column: 2 / 4; font-size: 11.5px; color: var(--dim); }
.cand.yes .mark { background: var(--ok); border-color: var(--ok); color: #fff; }
.cand.yes .mark::after { content: "✓"; }
.cand.no { opacity: .45; }
.cand.no .name { text-decoration: line-through; text-decoration-color: var(--faint); }
.cand.no .mark::after { content: "✕"; color: var(--faint); }
.cand.flip { animation: flip .5s ease; }
@keyframes flip { 0% { background: var(--panel2); } 100% { background: transparent; } }
.cand.edited .mark { box-shadow: 0 0 0 2px var(--acc); }
.editable .cand .mark { cursor: pointer; }
.cand.open { background: var(--panel2); }
.cand.later { display: none; }
.col.all .cand.later { display: grid; }
.col .more { margin: 6px 0 2px 34px; font-size: 12.5px; }

/* forks, interpretations, answers */
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.opt { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; width: fit-content; max-width: 100%; transition: border-color .2s; }
.opt:hover { border-color: var(--dim); }
.opt.ticked { border-color: var(--acc); }
.opt small { color: var(--dim); }
.opt input { margin: 0; width: 16px; height: 16px; accent-color: var(--acc); cursor: pointer; }
.opt .optname { border: 0; background: none; padding: 0; text-align: left; }
.opt .see { border: 0; background: none; padding: 0 0 0 4px; color: var(--acc); font-size: 12.5px; white-space: nowrap; }
.opt .see::after { content: " ▾"; display: inline-block; transition: transform .2s; }
.opt.open .see::after { transform: rotate(180deg); }
.opt button:disabled, .opt input:disabled { cursor: default; }
.peek { margin: 2px 0 6px 26px; padding: 12px 14px; border-left: 3px solid var(--acc); background: var(--panel); border-radius: 0 12px 12px 0; animation: rise .3s ease; max-width: calc(100% - 26px); }
.peek .what { font-weight: 550; }
.peek .what code { font-weight: 400; }
.peek .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.peek .chip { font-size: 12px; background: var(--panel2); border-radius: 999px; padding: 1px 9px; }
.peek .chip.link { color: var(--dim); }
.peek table.rows { font-size: 12.5px; }
.peek table.rows td { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; background: var(--panel2); padding: 0 5px; border-radius: 5px; }
.route { border-left: 3px solid var(--acc); padding: 2px 0 2px 12px; }
.wording { color: var(--faint); font-size: 12px; }
.card { background: var(--panel); border-radius: 14px; padding: 10px 14px; margin: 8px 0; }
.card .title { font-weight: 600; }
.card .bind { font-size: 13px; color: var(--dim); }
.card label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.card label input { margin-top: 5px; }
table.rows { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 6px; }
table.rows th, table.rows td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.rows th { color: var(--dim); font-weight: 500; }
table.rows th.hl, table.rows td.hl { background: var(--ok-bg); }
details summary { cursor: pointer; color: var(--dim); font-size: 13px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--panel2); padding: 8px 10px; border-radius: 8px; margin: 6px 0; }

/* composer at the bottom of the chat */
#composer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 18px; background: linear-gradient(transparent, var(--bg) 30%); }
#composer .box { margin: 0 auto; box-shadow: var(--shadow); }
body.side-open #composer { padding-right: 456px; }

/* side panel: a place's rows */
#side { position: fixed; top: 52px; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg); border-left: 1px solid var(--line); padding: 14px 16px; overflow: auto; transform: translateX(100%); transition: transform .3s ease; z-index: 15; }
body.side-open #side { transform: none; }
#side h3 { margin: 0; font-size: 15px; }
#side .x { float: right; border: 0; background: none; font-size: 20px; color: var(--dim); }
#side input[type=search] { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 10px; margin: 10px 0 4px; }
#side table.rows { font-family: ui-monospace, monospace; font-size: 12px; }

/* benchmark question list */
#picker { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; z-index: 30; padding: 16px; }
#picker .sheet { background: var(--bg); border-radius: 16px; width: min(720px, 100%); max-height: 75vh; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--line); }
#picker input { margin: 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; outline: 0; }
#picker ul { list-style: none; margin: 0; padding: 0 8px 10px; overflow: auto; }
#picker li button { width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; }
#picker li button:hover { background: var(--panel); }

.pill.on { color: var(--text); border-color: var(--dim); }
.pill:disabled { opacity: .5; cursor: default; }

/* layout: the chats on the left, the live map on the right; the chat sits between */
:root { --navw: 0px; --mapw: 0px; }
body.nav-open { --navw: 272px; }
body.map-open.chatting { --mapw: min(46vw, 760px); }
body { padding-left: var(--navw); padding-right: var(--mapw); transition: padding .4s ease; }
#composer { left: var(--navw); right: var(--mapw); transition: left .4s ease, right .4s ease; }
body.map-open.chatting #side { width: max(var(--mapw), min(440px, 100%)); }
body.map-open.chatting.side-open #chat { margin: 0 auto; }
body.map-open.chatting.side-open #composer { padding-right: 16px; }

/* chat history */
#nav { position: fixed; top: 52px; left: 0; bottom: 0; width: 272px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; padding: 10px; transform: translateX(-100%); transition: transform .4s ease; z-index: 18; }
body.nav-open #nav { transform: none; }
#nav .new { width: 100%; text-align: left; }
#nav input[type=search], #nav select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 5px 9px; font-size: 13px; }
.navrow { display: flex; gap: 6px; }
.navrow select { flex: 1; }
#nav .seg { width: 100%; }
#nav .seg button { flex: 1; }
#navlist { flex: 1; overflow: auto; margin: 0 -4px; padding: 0 4px; }
.navsec { margin: 8px 0 4px; border-radius: 10px; transition: background .2s; }
.navsec.drop { background: var(--panel2); outline: 1px dashed var(--acc); }
.navhead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); padding: 2px 6px 4px; }
.navhead span { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navicon { border: 0; background: none; color: var(--faint); padding: 0 3px; font-size: 13px; }
.navicon:hover { color: var(--text); }
.navitem { display: flex; align-items: center; border-radius: 9px; animation: rise .3s ease; }
.navitem:hover, .navitem.on { background: var(--panel2); }
.navopen { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 6px 8px; display: flex; flex-direction: column; }
.navtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.navopen small { color: var(--dim); font-size: 11.5px; }
.navitem.live .navtitle::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; animation: blink 1.2s infinite; }
.navmore { border: 0; background: none; color: var(--dim); padding: 4px 8px; opacity: 0; }
.navitem:hover .navmore, .navitem.on .navmore, .navmore:focus { opacity: 1; }
.navempty { color: var(--faint); font-size: 12.5px; padding: 4px 8px 8px; }
.navfoot { display: flex; gap: 6px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.navfoot button { font-size: 12.5px; }
.navfoot .bad { color: var(--no); }
.menu { position: fixed; z-index: 40; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; display: flex; flex-direction: column; animation: rise .15s ease; }
.menu button { border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: 7px; font-size: 13.5px; }
.menu button:hover { background: var(--panel); }
.menu button.on::after { content: " ✓"; color: var(--acc); }
.menu .menuhead { font-size: 11.5px; color: var(--dim); padding: 4px 10px 2px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.menu .bad { color: var(--no); }

/* the live map */
#map { position: fixed; top: 52px; right: 0; bottom: 0; width: var(--mapw); border-left: 1px solid var(--line); background: var(--bg); overflow: hidden; transform: translateX(100%); transition: transform .4s ease, width .4s ease; z-index: 12;
  display: flex; flex-direction: column; gap: 10px; padding: 10px; }
.pane { background: color-mix(in srgb, var(--panel) 55%, var(--bg)); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; transition: flex-basis .35s ease; }
#lakecard { flex: 0 0 min(340px, 42%); }
#diagcard { flex: 1 1 0; }
#map.big-lake #lakecard, #map.big-diag #diagcard { flex: 1 1 0; }
#map.big-lake #diagcard, #map.big-diag #lakecard { display: none; }
.cardhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.cardhead b { font-size: 14px; }
.cardhead .note { color: var(--dim); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 0; }
.cardhead .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.cardhead .seg button { padding: 2px 9px; font-size: 12px; }
.cardhead #mapnow, .cardhead .legend { flex-basis: 100%; }
.iconbtn { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--dim); font-size: 14px; line-height: 1; display: inline-grid; place-items: center; }
.iconbtn:hover { color: var(--text); border-color: var(--dim); }
.iconbtn[data-big]::before { content: "\2922"; }
#map.big-lake [data-big="lake"]::before, #map.big-diag [data-big="diag"]::before { content: "\2921"; }
.cardscroll { overflow: auto; flex: 1 1 0; min-height: 0; }
.lakestage { position: relative; flex: 1 1 0; min-height: 0; }
#lakemap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#lakemap.dragging { cursor: grabbing; }
#lakemap.over { cursor: pointer; }
.lakehelp { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--faint); pointer-events: none; }
.lakeinfo { position: absolute; right: 8px; top: 8px; max-height: calc(100% - 16px); width: min(300px, 70%); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; box-shadow: var(--shadow); }
.lakeinfo .x { position: absolute; right: 6px; top: 6px; }
.lakeinfo b { display: block; font-size: 13.5px; padding-right: 30px; overflow-wrap: anywhere; }
.lakeinfo small { color: var(--dim); display: block; margin-bottom: 6px; }
.lakeinfo .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--line); }
.lakeinfo .row span:last-child { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.lakeinfo .row.kept span:first-child { color: var(--ok); font-weight: 600; }
.lakeinfo .row.dropped span:first-child { text-decoration: line-through; color: var(--faint); }
.lakeinfo .row.on { background: color-mix(in srgb, var(--acc) 10%, transparent); }
.lakeinfo p { margin: 4px 0 8px; color: var(--dim); }

body.map-open.chatting #map { transform: none; }
.maphead b { font-size: 14px; }
#mapnow { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 4px; min-height: 20px; }
#mapnow .dots i { width: 5px; height: 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--dim); margin-top: 6px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--faint); vertical-align: middle; margin-right: 4px; }
.legend .kept i { border-color: var(--ok); }
.legend .seen i { border-top-style: dashed; }
.legend .drop i { opacity: .3; }
.legend .pick i { border-color: var(--acc); border-top-width: 3px; }
.legend .join i { border-color: var(--acc); border-top-style: dotted; }
#mapbody { position: relative; padding: 14px 12px 30px; }
#mapedges { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.lanes { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 54px; position: relative; }
.lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lanehead { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
.mnode { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 6px 9px; font-size: 12.5px; opacity: 0; transform: translateX(-10px) scale(.98); transition: opacity .5s ease, transform .5s ease, border-color .4s, background .4s, box-shadow .4s; }
.mnode.in { opacity: 1; transform: none; }
.mnode b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mnode small { color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mnode .cols { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.mnode .c { font-size: 11px; border-radius: 6px; padding: 0 5px; background: var(--panel2); color: var(--dim); transition: background .4s, color .4s, opacity .4s; }
.mnode .c.kept { background: var(--ok-bg); color: var(--ok); }
.mnode .c.dropped { opacity: .45; text-decoration: line-through; }
.mnode .mbar { height: 3px; background: var(--panel2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.mnode .mbar i { display: block; height: 100%; background: var(--acc); opacity: .6; transition: width .6s ease; }
.mnode.kept { border-color: var(--ok); }
.mnode.in.dropped, .mnode.in.passed, .mnode.in.off { opacity: .38; }
.mnode.in.asking { border-color: var(--acc); animation: ask 1.6s ease-in-out infinite; }
.mnode.used, .mnode.picked, .mnode.chosen { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 9%, var(--panel)); }
.mnode.in.running { border-color: var(--acc); animation: ask 1s ease-in-out infinite; }
.mnode.answered { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--panel)); }
.mnode.failed { border-color: var(--no); }
.mnode .ans { margin-top: 4px; font-size: 12px; color: var(--ok); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mnode.failed .ans { color: var(--no); }
@keyframes ask { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 35%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--acc) 12%, transparent); } }
.mmore { font-size: 11.5px; color: var(--faint); padding-left: 4px; }
.e { fill: none; stroke: var(--faint); stroke-width: 1.3; transition: stroke .4s, stroke-width .4s, opacity .4s; }
.e.seen { stroke-dasharray: 3 4; }
.e.kept { stroke: var(--ok); stroke-width: 1.6; }
.e.dropped { opacity: .22; stroke-dasharray: 2 5; }
.e.asking { stroke: var(--acc); stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
.e.picked { stroke: var(--acc); stroke-width: 2.2; }
.e.join { stroke: var(--acc); stroke-width: 1.8; stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.e.use { stroke: var(--dim); stroke-width: 1.2; opacity: .6; }
.e.use.chosen, .e.use.running, .e.use.answered { stroke: var(--acc); stroke-width: 2; opacity: 1; }
.e.use.off { opacity: .12; }
.e.fresh { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -11; } }
.mapempty { color: var(--faint); font-size: 13px; padding: 30px 0; text-align: center; }

@media (max-width: 1000px) {
  body.nav-open { --navw: 0px; }
  body.map-open.chatting { --mapw: 0px; }
  body.nav-open #nav { box-shadow: var(--shadow); }
  body.map-open.chatting #map { width: 100%; }
}

@media (max-width: 640px) {
  header .stat, #modelsel, #thinkbtn, #effortsel { display: none; }
  .col { min-width: 210px; }
}
</style>
</head>
<body>
<header>
  <button class="navicon" id="navbtn" aria-label="Show or hide your chats" title="Your chats" style="font-size:18px">☰</button>
  <span class="logo" id="home" title="New chat">AMIGO</span>
  <select class="pill" id="lakesel" aria-label="Lake"></select>
  <select class="pill" id="modelsel" aria-label="Model"><option>model…</option></select>
  <button class="pill" id="thinkbtn" hidden title="Whether the model reasons before it answers">Thinking on</button>
  <select class="pill" id="effortsel" aria-label="Reasoning effort" hidden title="How long the model reasons before it answers"></select>
  <span class="grow"></span>
  <span class="stat" id="stat" hidden></span>
  <span class="seg" id="viewseg" hidden><button data-v="normal" class="on">Normal</button><button data-v="verbose">Verbose</button></span>
  <button class="pill" id="mapbtn" hidden title="Show or hide the live map">Map</button>
  <button class="ghost" id="newchat" hidden>New chat</button>
</header>

<nav id="nav" aria-label="Your chats">
  <button class="ghost new" id="navnew">+ New chat</button>
  <input id="navq" type="search" placeholder="Search chats" aria-label="Search chats">
  <div class="navrow">
    <select id="navlake" aria-label="Filter by lake"><option value="">All lakes</option></select>
    <select id="navtime" aria-label="Filter by time"><option value="">Any time</option><option value="day">Today</option><option value="week">Last 7 days</option><option value="month">Last 30 days</option></select>
  </div>
  <span class="seg" id="navgroup" title="Group the chats by"><button data-g="time">Time</button><button data-g="lake">Lake</button><button data-g="folder">Folder</button></span>
  <div id="navlist"></div>
  <div class="navfoot"><button class="ghost" id="newfolder">+ New folder</button><button class="ghost bad" id="delall">Delete all</button></div>
</nav>

<aside id="map" aria-label="Live map of the search">
  <section class="pane" id="lakecard">
    <div class="cardhead">
      <b>Lake</b><span class="note" id="lakenote"></span>
      <span class="tools">
        <span class="seg" id="lakedim"><button data-v="2">2D</button><button data-v="3">3D</button></span>
        <span class="seg" id="lakekind"><button data-v="table">Tables</button><button data-v="column">Columns</button></span>
        <button class="iconbtn" id="lakefollow" title="Follow the search again">&#8982;</button>
        <button class="iconbtn" data-big="lake" title="Expand"></button>
      </span>
    </div>
    <div class="lakestage">
      <canvas id="lakemap"></canvas>
      <div class="lakehelp" id="lakehelp"></div>
      <div class="lakeinfo" id="lakeinfo" hidden></div>
    </div>
  </section>
  <section class="pane" id="diagcard">
    <div class="cardhead maphead">
      <b>Search</b><span class="note" id="mapq"></span>
      <span class="tools"><button class="iconbtn" data-big="diag" title="Expand"></button></span>
      <div id="mapnow"></div>
      <div class="legend"><span class="seen"><i></i>considered</span><span class="kept"><i></i>kept by the judge</span><span class="drop"><i></i>dropped</span><span class="pick"><i></i>chosen</span><span class="join"><i></i>join</span></div>
    </div>
    <div class="cardscroll">
      <div id="mapbody">
        <svg id="mapedges"></svg>
        <div class="lanes">
          <div class="lane"><div class="lanehead">Parts</div><div class="lane" id="lparts"></div></div>
          <div class="lane"><div class="lanehead">Places</div><div class="lane" id="ltables"></div></div>
          <div class="lane"><div class="lanehead">Interpretations</div><div class="lane" id="linterps"></div></div>
        </div>
        <div class="mapempty" id="mapempty">The map fills in as the search runs.</div>
      </div>
    </div>
  </section>
</aside>

<main id="start">
  <h1>What do you want to find?</h1>
  <form class="box" id="startform">
    <textarea id="q" rows="1" placeholder="Ask a question about this lake" aria-label="Question"></textarea>
    <button class="send" id="go" aria-label="Send" disabled>↑</button>
  </form>
  <button class="link" id="pick">or pick a benchmark question</button>
  <div class="err" id="starterr" hidden></div>
</main>

<main id="chat" hidden></main>

<div id="composer" hidden>
  <form class="box" id="replyform">
    <textarea id="reply" rows="1" placeholder="Type a new question" aria-label="Reply"></textarea>
    <button class="send" id="replygo" aria-label="Send">↑</button>
  </form>
</div>

<aside id="side" aria-label="Place contents"></aside>

<div id="picker" hidden>
  <div class="sheet">
    <input id="pickq" type="search" placeholder="Search the benchmark questions" aria-label="Search questions">
    <ul id="picklist"></ul>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const enc = encodeURIComponent;
const fmt = (sec) => { sec = Math.max(0, Math.floor(sec || 0)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// every request goes through here: a non-2xx answer throws with the server's own words
let runNumber = null;
async function api(url, body) {
  if (body !== undefined) firstLoad = false;
  const r = body === undefined ? await fetch(url)
    : await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ run: runNumber, ...body }) });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error) || r.statusText || 'HTTP ' + r.status);
  return data;
}

// ---- lake, model, questions ----
let lake = '', questions = [];
async function loadLakes() {
  const lakes = await api('/lakes');
  const sel = $('lakesel'); sel.replaceChildren();
  for (const name of lakes) { const o = el('option', null, name); o.value = name; sel.append(o); }
  const saved = store.get('amigo.lake');
  lake = lakes.includes(saved) ? saved : lakes[0];
  sel.value = lake;
  loadQuestions();
}
$('lakesel').addEventListener('change', () => { lake = $('lakesel').value; answers = []; chosenId = null; setLive(live); store.set('amigo.lake', lake); loadQuestions(); });
async function loadQuestions() {
  questions = [];
  lakeLoad(lake);
  try { questions = await api('/questions?lake=' + enc(lake)); } catch (e) {}
  $('pick').hidden = !questions.length;
}
// thinking: "none" is off; null is each step's own level (high to split the question,
// medium for the judge, low for wording); any other level is used by every call
let lastEffort = null;
async function loadSettings() {
  try {
    const s = await api('/settings');
    const sel = $('modelsel'); sel.replaceChildren();
    for (const name of Object.keys(s.models)) { const o = el('option', null, name); o.value = name; sel.append(o); }
    sel.value = s.model;
    const levels = s.efforts[s.model], think = $('thinkbtn'), effort = $('effortsel');
    modelLevels = levels || [];
    think.hidden = effort.hidden = !levels;
    if (!levels) return;
    const on = s.thinking !== 'none';
    think.textContent = on ? 'Thinking on' : 'Thinking off';
    think.classList.toggle('on', on);
    think.disabled = !levels.includes('none');
    think.title = think.disabled ? 'This model always thinks' : 'Whether the model reasons before it answers';
    effort.replaceChildren();
    const auto = el('option', null, 'Effort: each step\'s own'); auto.value = ''; effort.append(auto);
    for (const level of levels.filter((l) => l !== 'none')) { const o = el('option', null, 'Effort: ' + level); o.value = level; effort.append(o); }
    effort.value = on && s.thinking ? s.thinking : '';
    effort.hidden = !on;
  } catch (e) {}
}
async function setSettings(body) {
  try { await api('/settings', body); } catch (e) { say(e.message, 'bad'); }
  loadSettings();
}
$('modelsel').addEventListener('change', () => setSettings({ model: $('modelsel').value }));
$('thinkbtn').addEventListener('click', () => {
  const on = $('thinkbtn').classList.contains('on');
  if (on) lastEffort = $('effortsel').value || null;
  setSettings({ model: $('modelsel').value, thinking: on ? 'none' : modelLevels.includes(lastEffort) ? lastEffort : null });
});
$('effortsel').addEventListener('change', () => setSettings({ model: $('modelsel').value, thinking: $('effortsel').value || null }));

// the benchmark question list
function openPicker() {
  $('picker').hidden = false; $('pickq').value = ''; fillPicker(); $('pickq').focus();
}
function fillPicker() {
  const words = $('pickq').value.toLowerCase().split(/\s+/).filter(Boolean);
  const list = $('picklist'); list.replaceChildren();
  for (const q of questions.filter((q) => words.every((w) => q.toLowerCase().includes(w))).slice(0, 300)) {
    const b = el('button', null, q);
    b.addEventListener('click', () => { $('picker').hidden = true; $('q').value = q; grow($('q')); refreshGo(); $('q').focus(); });
    const li = el('li'); li.append(b); list.append(li);
  }
}
$('pick').addEventListener('click', openPicker);
$('pickq').addEventListener('input', fillPicker);
$('picker').addEventListener('click', (e) => { if (e.target === $('picker')) $('picker').hidden = true; });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('picker').hidden) $('picker').hidden = true;
  else closeSide();
});

// ---- the two text boxes ----
function grow(t) { t.style.height = 'auto'; if (t.scrollHeight) t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
function refreshGo() { $('go').disabled = !$('q').value.trim(); }
for (const [box, form] of [['q', 'startform'], ['reply', 'replyform']]) {
  $(box).addEventListener('input', () => { grow($(box)); refreshGo(); });
  $(box).addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!live || $(box).value.trim()) $(form).requestSubmit(); } });
}
$('startform').addEventListener('submit', (e) => { e.preventDefault(); const q = $('q').value.trim(); if (q) startRun(q); });
$('replyform').addEventListener('submit', (e) => {
  e.preventDefault();
  if (live) { if (!$('reply').value.trim()) cancelRun(); else typed($('reply').value.trim()); return; }
  const q = $('reply').value.trim();
  if (!q) return;
  $('reply').value = ''; grow($('reply'));
  if (routing) return;
  if (answers.length) followUp(q); else startRun(q);
});

// ---- view: normal or verbose ----
function setView(v) {
  document.body.classList.toggle('verbose', v === 'verbose');
  for (const b of $('viewseg').children) b.classList.toggle('on', b.dataset.v === v);
  store.set('amigo.view', v);
}
$('viewseg').addEventListener('click', (e) => { if (e.target.dataset.v) setView(e.target.dataset.v); });
setView(store.get('amigo.view') || 'normal');

// ---- the chat ----
const chat = $('chat');
let liveLine = null, logBox = null;
function showChat() {
  $('start').hidden = true; chat.hidden = false; $('composer').hidden = false;
  document.body.classList.add('chatting'); $('mapbtn').hidden = false; mapSoon();
  $('viewseg').hidden = false; $('newchat').hidden = false; $('stat').hidden = false;
}
function showStart() {
  if (live || routing) return;
  stopClock(); 
  if (source) source.close();
  chat.replaceChildren(); chat.hidden = true; $('composer').hidden = true;
  $('viewseg').hidden = true; $('newchat').hidden = true; $('stat').hidden = true;
  $('start').hidden = false; closeSide(); $('q').focus();
  document.body.classList.remove('chatting'); $('mapbtn').hidden = true;
  viewChat = null; oldView = false; answers = []; chosenId = null; mapReset(''); drawNav();
}
$('home').addEventListener('click', showStart);
$('newchat').addEventListener('click', showStart);
const nearBottom = () => window.innerHeight + window.scrollY > document.body.scrollHeight - 220;
function add(node) {
  const follow = nearBottom();
  if (liveLine && liveLine.parentNode === chat) chat.insertBefore(node, liveLine); else chat.append(node);
  if (follow) node.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return node;
}
function me(text) { logBox = null; return add(el('div', 'me', text)); }
function bot(stepText) {
  logBox = null;
  const b = el('div', 'bot');
  if (stepText) b.append(el('div', 'step', stepText));
  return add(b);
}
function say(text, cls) { const b = bot(); b.append(el('p', cls || null, text)); return b; }
// the animated line under the chat, saying what runs now; null hides it
function working(text) {
  if (text == null) { if (liveLine) liveLine.remove(); liveLine = null; return; }
  if (!liveLine) {
    liveLine = el('div'); liveLine.id = 'live';
    const dots = el('span', 'dots'); dots.append(el('i'), el('i'), el('i'));
    liveLine.append(dots, el('span'));
  }
  liveLine.lastChild.textContent = text;
  mapNow(text);
  if (liveLine.parentNode !== chat) chat.append(liveLine);
  if (nearBottom()) liveLine.scrollIntoView({ block: 'end' });
}
// verbose only: the pipeline's own log lines, grouped under the last message
function logLine(text, cls) {
  if (!logBox) { logBox = el('div', 'log mono verbose-only'); add(logBox); }
  const line = el('div', cls || null, text);
  logBox.append(line);
  logBox.scrollTop = logBox.scrollHeight;
}

// ---- run state ----
let source = null, live = false, clock = null, clockStart = 0, usageTimer = null;
let parts = [];                       // the parts with their values, in order
let placeCards = null;                // the places card: per part, its rows
let placesOpen = false;               // the person may keep or drop places now
let fork = null, forkBox = null;      // the question on screen, and its message
let interps = new Map(), pickBox = null;
let restartWith = null;
let firstLoad = true;     // the events replayed on page load, until the person acts
let answers = [], chosenId = null;  // the run's answered interpretations, and the one kept
let following = null;     // a follow-up sent: its route, so the run it starts is not shown twice
let routing = false;      // a follow-up is being routed: no second one, no new chat until it starts
let modelLevels = [];     // the thinking levels of the model in use
let R = null;             // the run drawn last: its question and the person's decisions so far

function resetRun() {
  parts = []; placeCards = null; placesOpen = false; fork = null; forkBox = null;
  interps = new Map(); pickBox = null; restartWith = null; logBox = null; answered = null;
  answers = []; chosenId = null;
}
async function startRun(question, replay) {
  $('starterr').hidden = true; firstLoad = false;
  try {
    runNumber = (await api('/ask', { lake, question, check: true, guided: true, chat: viewChat, replay })).run;
  } catch (e) {
    if (chat.hidden) { $('starterr').textContent = 'The run did not start: ' + e.message; $('starterr').hidden = false; }
    else say('The run did not start: ' + e.message, 'bad');
    return;
  }
  $('q').value = ''; $('reply').value = ''; grow($('reply')); refreshGo();
  listen();
  return true;
}
async function cancelRun() {
  try { await api('/cancel', {}); } catch (e) { say(e.message, 'bad'); }
}
function setLive(on) {
  live = on;
  $('replygo').classList.toggle('stop', on);
  $('replygo').textContent = on ? '' : '↑';
  $('replygo').setAttribute('aria-label', on ? 'Stop the run, or send what you typed' : 'Send');
  $('reply').placeholder = on ? 'Answer in your own words, or press the square to stop'
    : answers.length ? 'Ask a follow-up about this answer' : oldView ? 'Ask a new question in this chat' : 'Type a new question';
  $('lakesel').disabled = on;
}
function startClock(t) {
  clockStart = performance.now() - (t || 0) * 1000;
  clearInterval(clock); clearInterval(usageTimer);
  clock = setInterval(showStat, 1000);
  usageTimer = setInterval(loadUsage, 4000);
  calls = 0; showStat();
}
function stopClock(t) {
  if (t != null) clockStart = performance.now() - t * 1000;
  clearInterval(clock); clearInterval(usageTimer); clock = null;
  loadUsage(); showStat();
}
let calls = 0, stopped = 0;
function showStat() {
  const sec = clock ? (performance.now() - clockStart) / 1000 : stopped;
  if (clock) stopped = sec;
  $('stat').textContent = `${fmt(sec)} · ${calls} LLM call${calls === 1 ? '' : 's'}`;
}
async function loadUsage() {
  if (replaying || oldView) return;  // the server counts its current run only
  try { calls = (await api('/usage')).run.calls; showStat(); } catch (e) {}
}

function listen() {
  if (source) source.close();
  const mine = source = new EventSource('/events');
  let chain = Promise.resolve(), seen = 0, n = 0;
  // a reconnect replays the run from its start: skip what was already drawn
  source.onopen = () => { n = 0; };
  source.onmessage = (m) => {
    if (++n <= seen) return;
    seen = n;
    // the replay on page load comes at once; after it, the run is the person's
    if (seen === 1 && firstLoad) setTimeout(() => { firstLoad = false; }, 1000);
    const ev = JSON.parse(m.data);
    if (clock && ev.t != null) clockStart = Math.min(clockStart, performance.now() - ev.t * 1000);
    chain = chain.then(() => source === mine && handle(ev)).catch((err) => console.error('event', ev.type, err));
  };
  source.onerror = () => {};
}
function handle(ev) { return (on[ev.type] || (() => {}))(ev); }

const literalText = (l) => {
  if (!l) return '';
  if (l.kind === 'number') return String(l.number);
  if (l.kind === 'text') return l.text || '';
  if (l.date_start && l.date_end) return l.date_start === l.date_end ? l.date_start : `${l.date_start} to ${l.date_end}`;
  return l.date_start ? `from ${l.date_start}` : `until ${l.date_end}`;
};
function parseValue(s) {
  s = s.trim();
  if (!s) return null;
  const blank = { text: null, number: null, date_start: null, date_end: null };
  if (/^-?\d+(\.\d+)?$/.test(s)) return { ...blank, kind: 'number', number: Number(s) };
  const d = '(\\d{4}-\\d{2}-\\d{2})';
  let m = s.match(new RegExp(`^${d}(?: to ${d})?$`));
  if (m) return { ...blank, kind: 'date', date_start: m[1], date_end: m[2] || m[1] };
  m = s.match(new RegExp(`^(from|until) ${d}$`));
  if (m) return { ...blank, kind: 'date', [m[1] === 'from' ? 'date_start' : 'date_end']: m[2] };
  return { ...blank, kind: 'text', text: s };
}
const partLabel = (p) => p.attribute + (p.literal ? ` = "${literalText(p.literal)}"` : '');

const on = {
  idle() { source.close(); },
  run(ev) {
    R = { question: ev.question, forks: [] };
    // what an earlier run left open belongs to it: a click there would act on this one
    for (const x of chat.querySelectorAll('button.act, input.act')) x.disabled = true;
    resetRun(); showChat(); setLive(true); startClock(ev.t);
    mapReset(ev.question);
    if (ev.chat) viewChat = ev.chat;
    if (!replaying) { oldView = false; $('stat').hidden = false; setTimeout(loadChats, 400); }
    if (ev.lake && ev.lake !== lake && [...$('lakesel').options].some((o) => o.value === ev.lake)) { lake = ev.lake; $('lakesel').value = lake; loadQuestions(); }
    // a follow-up's own words are already in the chat, and its question with its route
    if (!following) me(ev.question);
    working('Splitting the question into parts');
  },
  route(ev) {
    if (!following) { if (ev.said) me(ev.said); showRoute(ev, null); }
    following = null;
    if (ev.route === 'rewrite') working('Rewriting the SQL');
  },
  held() { working('Waiting for the stopped run: its LLM calls must come back first'); },
  log(ev) { logLine(ev.text); },

  // step 1: the parts, checked by the person
  parts_paused(ev) { partsStep(ev.entities); reveal(partsBox); working(null); mapParts(ev.entities); mapNow('Waiting for you: check the parts'); },
  bundle(ev) {
    parts = ev.entities; mapParts(ev.entities);
    if (R) R.parts = ev.entities;
    lockParts(ev.entities);
    logLine(`Searched ${ev.tables.length} table${ev.tables.length === 1 ? '' : 's'} for the parts`);
    for (const nf of ev.not_found || []) {
      say(`"${nf.written}" was not found as a value in this lake.` + (nf.near.length ? ' Nearest columns: ' + nf.near.join(', ') : ''), 'note');

  },

  // step 2: the places, then step 3: the judge
  candidates(ev) { placesStep(ev.parts); mapPlaces(ev.parts); working('The judge reads each place'); },
  places(ev) {

  },
  places_paused() { openPlaces(); reveal(placeCards && placeCards.box); working(null); mapNow('Waiting for you: keep or drop places'); },

  // step 4: the guided search asks at each fork
  fork(ev) { closePlaces(); showFork(ev); if (!ev.replayed) reveal(forkBox); working(null); mapFork(ev); },
  answered(ev) {

  interpretations(ev) { closePlaces(); if (fork) closeFork(); showInterps(ev); mapInterps(ev.interpretations || []); },

  querying(ev) { working('Writing SQL for ' + name(ev.id)); mapInterp(ev.id, 'running'); },
  sql(ev) { logLine(ev.error != null ? `${ev.id} try ${ev.attempt}: ${ev.error}` : `${ev.id} try ${ev.attempt}: ${ev.rows} rows`, ev.error != null ? 'bad' : null); },
  rows(ev) {

  chosen(ev) { chosenId = ev.id; say(`Following up on ${name(ev.id).replace(/^I/, 'i')}.`, 'note'); },

  done(ev) {

  error(ev) { if (!finish(ev.t)) say('The run hit an error: ' + ev.text, 'bad'); mapNow('The run hit an error'); if (!replaying) loadChats(); },
  cancelled(ev) { answers = []; chosenId = null; if (!finish(ev.t)) say('Stopped.', 'note'); mapNow('Stopped'); if (!replaying) loadChats(); },

// true when the run was only replayed on page load: then the page opens on a new chat instead

// ---- step 1 ----
let partsBox = null, approvedHere = null;  // the bubble the Approve click drew
function partsStep(list) {
  const b = bot('Step 1 · Parts of the question');
  b.append(el('p', 'note', 'Each part is something the question asks for or filters on, with its value if it has one. Change them if they are wrong, then go on.'));
  const row = el('div', 'parts');
  const addBtn = el('button', 'part add act', '+ add a part');
  const addPart = (p) => {
    const chip = el('span', 'part');
    const attr = el('input', 'attr'); attr.value = p ? p.attribute : ''; attr.placeholder = 'part'; attr.setAttribute('aria-label', 'Part');
    const val = el('input', 'val'); val.value = p && p.literal ? literalText(p.literal) : ''; val.placeholder = 'no value'; val.setAttribute('aria-label', 'Value');
    const x = el('button', 'x act', '×'); x.title = 'Remove this part';
    const wrote = val.value;
    chip._read = () => ({ attribute: attr.value.trim(), literal: val.value.trim() === wrote && p && p.literal ? p.literal : parseValue(val.value) });
    const size = () => { attr.size = Math.max(4, attr.value.length + 1); val.size = Math.max(7, val.value.length + 1); };
    attr.addEventListener('input', size); val.addEventListener('input', size); size();

    go.disabled = true;

    try { await api('/parts', { entities: given }); }

}
function lockParts(list) {

// ---- going back to an earlier decision ----

}

// ---- steps 2 and 3 ----
const itemName = (it) => `${it.table_name}.${it.name}`;
const SHOW = 10;   // places shown per part before "show all"

}
function placesStep(list) {

}
function verdicts(list, edited) {

    setTimeout(() => {

  }));

    const b = placeCards.box;
    const step = el('div', 'step', 'Step 3 · The judge');
    step.style.marginTop = '12px';
    const line = el('p', null, `The judge (one LLM call) kept ${kept} of ${all} places.`);

  }
}
function countKept() {

}
function openPlaces() {

  placesOpen = true;

  countKept();

  const ok = el('button', 'btn act', 'Approve');
  const undo = el('button', 'btn line act', 'Back to the judge\'s choice');
  undo.addEventListener('click', () => {
    for (const c of placeCards) for (const r of c.rows) { r.keep = r.judged; r.classList.toggle('yes', r.keep); r.classList.toggle('no', !r.keep); r.classList.remove('edited'); }
    countKept();
  });
  ok.addEventListener('click', async () => {
    const changed = placeCards.some((c) => c.rows.some((r) => r.keep !== r.judged));
    const keep = changed ? placeCards.map((c) => c.rows.filter((r) => r.keep).map((r) => [r.item.table, r.item.column])) : null;
    ok.disabled = undo.disabled = true;
    const n = placeCards.reduce((s, c) => s + c.rows.filter((r) => r.keep).length, 0);

    catch (e) { approvedHere = null; m.remove(); working(null); ok.disabled = undo.disabled = false; say(e.message, 'bad'); return; }
    closePlaces();

function closePlaces() {

}

// ---- side panel: one place's rows ----
let sideState = null;
function openSide(it, part, row) {

  row.classList.add('open');
  const hit = it.hit && it.hit.length ? it.hit[0] : '';
  sideState = { it, q: hit, page: 0, row };

  const t = el('table', 'rows'); const tr = el('tr');

// ---- step 4: the guided search ----
const share = (s) => (s == null ? '' : s < 0.01 ? 'under 1% of the ways' : `${Math.round(s * 100)}% of the ways`);

let answered = null;   // the fork just answered: a late reworded copy of it is not shown

  const b = again ? forkBox : bot(`Question ${ev.step + 1} · ${ev.about}`);
  if (again) b.replaceChildren(el('div', 'step', `Question ${ev.step + 1} · ${ev.about}`));
  forkBox = b;
  const q = el('p', null, ev.question);
  if (!ev.worded) q.append(el('span', 'wording', '  (putting it in plain words…)'));
  b.append(q);
  for (const n of ev.notes || []) b.append(el('p', 'note verbose-only', 'Not asked: ' + n));
  // a click on an option shows the rows it reads; its box ticks it; Proceed goes on with
  // the ticked ones. The ticks and the open look survive the question being reworded.
  const ticks = again && b._ticks ? b._ticks : new Set();
  b._ticks = ticks;
  const opts = el('div', 'opts');
  const go = el('button', 'btn act', 'Proceed');
  const tally = () => {
    go.disabled = !ticks.size;
    go.textContent = ticks.size > 1 ? `Proceed with these ${ticks.size}` : 'Proceed';
  };
  const peekable = ev.fork !== 'missing';
  ev.options.forEach((o) => {
    const wrap = el('div');
    const row = el('div', 'opt');
    const tick = el('input', 'act'); tick.type = 'checkbox'; tick.checked = ticks.has(o.id);
    tick.setAttribute('aria-label', 'Choose: ' + o.label);
    row.classList.toggle('ticked', tick.checked);
    tick.addEventListener('change', () => {
      // a missing part takes one answer: a new tick clears the others

        for (const other of opts.querySelectorAll('.opt')) other.classList.remove('ticked');

      if (tick.checked) ticks.add(o.id); else ticks.delete(o.id);

    });
    const label = el('button', 'optname act', o.label);

    if (o.share != null) row.append(el('small', null, share(o.share)));

      label.addEventListener('click', () => peek(o, wrap, row, b));

    opts.append(wrap);

    const picked = ev.options.filter((o) => ticks.has(o.id));

  });

  b.append(opts);
  if (ev.more) b.append(el('p', 'note', `${ev.more} more behind "None of these".`));
  const r = el('div', 'row'); r.append(go);
  const extra = (label, payload) => { const x = el('button', 'btn line act', label); x.addEventListener('click', () => act(payload, label)); r.append(x); };

  b.append(r, el('p', 'note', (peekable ? 'Click an option to see the data behind it. Tick the ones you mean, then proceed. ' : 'Tick one, then proceed. ') + 'Or answer in your own words in the box below.'));
}
// one option's look: where it places the part, what that place holds, its tables and joins,

async function peek(o, wrap, row, box) {

// ---- live map: the parts, the places weighed for each, and what the search settles on ----

  $('mapq').textContent = question || '';

function mapNow(text) {

  if (!text) return;

  box.append(el('span', null, text));
}

      M.weighed.add(`${it.database}.${it.table_name}`);
      if (k >= MAP_TOP && it.yes !== true) { M.more++; return; }
      const state = it.yes === true ? 'kept' : it.yes === false ? 'dropped' : 'seen';
      const t = mapTable(`${it.database}.${it.table_name}`, {});
      t.rows = it.rows; t.score = Math.max(t.score, it.score);
      t.state = t.state && RANK[t.state] >= RANK[state] ? t.state : state;

  const box = $('lakemap').getBoundingClientRect(), mx = e.clientX - box.left, my = e.clientY - box.top;
  let best = null, gap = 10;
  for (const d of lakeDots().values()) {
    if (d.x == null) continue;
    const far = Math.hypot(d.x - mx, d.y - my);
    if (far < gap) { gap = far; best = d; }
  }
  return best;
}
// you move the view: it stops following the search until the follow button
$('lakemap').addEventListener('pointerdown', (e) => {
  L.drag = { x: e.clientX, y: e.clientY, moved: false, pan: L.dim !== 3 || e.shiftKey || e.button === 2 };
  try { $('lakemap').setPointerCapture(e.pointerId); } catch (err) {}
  $('lakemap').classList.add('dragging');
});
$('lakemap').addEventListener('pointermove', (e) => {
  if (!L.drag) {
    const d = lakeNearest(e);
    $('lakemap').classList.toggle('over', !!d);
    if (d !== L.hover) { L.hover = d; lakeDraw(); }
    return;
  }
  const dx = e.clientX - L.drag.x, dy = e.clientY - L.drag.y;
  if (!L.drag.moved && Math.hypot(dx, dy) < 4) return;
  L.drag.moved = true; L.follow = false; L.drag.x = e.clientX; L.drag.y = e.clientY;
  const cv = $('lakemap'), s = Math.min(cv.offsetWidth, cv.offsetHeight) / L.cam.span;
  if (L.drag.pan) {
    const { yaw } = L.cam, ux = dx / s, uy = dy / s;
    if (L.dim === 3) { L.cam.c[0] -= ux * Math.cos(yaw); L.cam.c[2] -= ux * Math.sin(yaw); L.cam.c[1] += uy; }
    else { L.cam.c[0] -= ux; L.cam.c[1] += uy; }
  } else {
    L.cam.yaw += dx * .008; L.cam.pitch = Math.max(-1.4, Math.min(1.4, L.cam.pitch + dy * .008));
  }
  lakeDraw();
});
$('lakemap').addEventListener('pointerup', (e) => {
  const click = L.drag && !L.drag.moved;
  L.drag = null; $('lakemap').classList.remove('dragging');
  if (click) lakeOpen(lakeNearest(e));
});
$('lakemap').addEventListener('contextmenu', (e) => e.preventDefault());
$('lakemap').addEventListener('wheel', (e) => {
  e.preventDefault(); L.follow = false;
  L.cam.span = Math.max(.05, Math.min(6, L.cam.span * Math.exp(e.deltaY * .0015)));
  lakeDraw();
}, { passive: false });
$('lakemap').addEventListener('mouseleave', () => { L.hover = null; lakeDraw(); });
new ResizeObserver(() => lakeDraw()).observe($('lakemap'));
$('lakefollow').addEventListener('click', () => { L.follow = true; lakeDraw(); });
$('lakedim').addEventListener('click', (e) => {
  const v = Number(e.target.dataset.v);
  if (!v || v === L.dim) return;
  L.dim = v; store.set('amigo.lakedim', v); L.trail = []; L.ring = null; L.follow = true; lakeDraw();
});
$('lakekind').addEventListener('click', async (e) => {
  const v = e.target.dataset.v;
  if (!v || v === L.kind) return;
  L.kind = v; store.set('amigo.lakekind', v); L.trail = []; L.ring = null; L.hover = null;
  if (v === 'column') await lakeColumns();
  lakeDraw();
});
// a table in the diagram points at its dot
$('ltables').addEventListener('mouseover', (e) => {
  const n = e.target.closest('.mnode'), d = n && n.dataset.key && L.dots.get(n.dataset.key.slice(1));
  const hover = d && L.kind === 'table' ? d : null;
  if (hover !== L.hover) { L.hover = hover; lakeDraw(); }
});
$('ltables').addEventListener('mouseleave', () => { L.hover = null; lakeDraw(); });
// each card can take the whole side, and give it back
for (const b of document.querySelectorAll('[data-big]')) b.addEventListener('click', () => {
  const cls = 'big-' + b.dataset.big, on = !$('map').classList.contains(cls);
  $('map').classList.remove('big-lake', 'big-diag');
  $('map').classList.toggle(cls, on);
  b.title = on ? 'Shrink' : 'Expand';
  mapSoon(); lakeDraw();
});
// a dot's content: the table's columns and a few real rows, or the column's values
async function lakeOpen(d) {
  const box = $('lakeinfo');
  L.sel = d || null; lakeDraw();
  if (!d) { box.hidden = true; return; }
  box.hidden = false; box.replaceChildren(el('small', null, 'loading…'));
  let t;
  try { t = await api(`/table?lake=${enc(L.lake)}&id=${d.table.id}`); } catch (e) { box.replaceChildren(el('small', null, e.message)); return; }
  if (L.sel !== d) return;
  const close = el('button', 'iconbtn x', '×'); close.title = 'Close'; close.onclick = () => lakeOpen(null);
  const said = M.tables && M.tables.get(d.table.path), state = (name) => (said && said.cols.get(name)) || '';
  const row = (a, b, cls) => { const r = el('div', 'row ' + (cls || '')); r.append(el('span', null, a), el('span', null, b)); return r; };
  if (d.column) {
    const c = t.columns.find((one) => one.name === d.column) || { samples: [] };
    box.replaceChildren(close, el('b', null, d.column), el('small', null, `column of ${t.database}.${t.name}`));
    if (c.description) box.append(el('p', null, c.description));
    box.append(row('kind', c.kind || ''), row('different values', (c.distinct_count ?? '').toLocaleString()),
      row('empty', c.empty_share != null ? Math.round(c.empty_share * 100) + '%' : ''));
    const i = t.header.indexOf(d.column);
    const values = i >= 0 ? t.rows.map((r) => r[i]) : c.samples;
    box.append(el('small', null, 'some values'), ...values.map((v) => row(String(v), '')));
  } else {
    box.replaceChildren(close, el('b', null, t.name), el('small', null, `${t.database} · ${t.row_count.toLocaleString()} rows · ${t.columns.length} columns`));
    if (t.description) box.append(el('p', null, t.description));
    for (const c of t.columns) box.append(row(c.name, (c.samples || []).slice(0, 3).join(', '), state(c.name)));
  }
}
// a table in the diagram points at its dot
$('ltables').addEventListener('mouseover', (e) => {
  const n = e.target.closest('.mnode'), d = n && L.dots.get(n.dataset.key.slice(1));
  if (d !== L.hover) { L.hover = d || null; lakeDraw(); }
});
$('ltables').addEventListener('mouseleave', () => { L.hover = null; lakeDraw(); });
function setMap(open) {
  document.body.classList.toggle('map-open', open);
  $('mapbtn').classList.toggle('on', open);
  store.set('amigo.map', open ? 'open' : 'closed');
  mapSoon(); lakeDraw();
}
$('mapbtn').addEventListener('click', () => setMap(!document.body.classList.contains('map-open')));

// ---- start ----
(async () => {
  await Promise.all([loadLakes().catch(() => {}), loadSettings()]);
  setNav(store.get('amigo.nav') ? store.get('amigo.nav') === 'open' : innerWidth > 1000);
  setMap(store.get('amigo.map') ? store.get('amigo.map') === 'open' : innerWidth > 1000);
  mapReset('');
  // a reload goes back to the run still going, if there is one
  const current = await loadChats();
  if (current && current.live) openChat(current.chat);
  $('q').focus();
})();
</script>
